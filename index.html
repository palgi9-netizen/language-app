<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteka opowieści — Story Library</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap');

  :root{
    --coral:#FF6B5B; --coral-deep:#E14B3B; --sun:#FFC93C; --sky:#39B7E8; --mint:#2FCB9E;
    --purple:#9B5DE5; --pink:#FF8FB1; --ink:#26232A; --ink-soft:#5B5566;
    --paper:#FFFDF6; --paper-2:#FFF3DD; --line:#EADFC0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; font-family:'Baloo 2',sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, #FFE9C2 0%, transparent 45%),
      radial-gradient(circle at 90% 15%, #CDEFFF 0%, transparent 42%),
      radial-gradient(circle at 85% 90%, #FFD7E4 0%, transparent 45%),
      radial-gradient(circle at 10% 92%, #D9F5EA 0%, transparent 45%),
      #FFFCF4;
    padding:32px 16px 60px;
  }
  .wrap{ width:100%; max-width:960px; margin:0 auto; display:flex; flex-direction:column; gap:26px; }
  .view{ display:none; }
  .view.active{ display:flex; flex-direction:column; gap:22px; }

  .btn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px;
    border:none; border-radius:100px; cursor:pointer; padding:14px 26px;
    display:inline-flex; align-items:center; gap:9px;
    transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  .btn svg{ width:19px; height:19px; flex-shrink:0; }
  .btn:hover{ transform:translateY(-2px); }
  .btn:active{ transform:translateY(0) scale(.98); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; transform:none; }
  .btn-primary{ color:#fff; background:linear-gradient(135deg, var(--coral), var(--pink)); box-shadow:0 10px 22px -8px rgba(225,75,59,.55); }
  .btn-primary:hover:not(:disabled){ filter:brightness(1.05); }
  .btn-ghost{ color:var(--ink); background:#fff; border:2px solid var(--line); box-shadow:0 4px 10px -4px rgba(0,0,0,.12); }
  .btn-ghost:hover:not(:disabled){ border-color:var(--sky); }
  .btn-home{ color:var(--ink); background:#fff; border:2px solid var(--line); box-shadow:0 4px 10px -4px rgba(0,0,0,.12); }
  .btn-home:hover:not(:disabled){ border-color:var(--sky); }
  .btn-nav{ color:#fff; background:linear-gradient(135deg, var(--sky), var(--mint)); box-shadow:0 8px 18px -8px rgba(47,203,158,.5); }
  .btn-nav:hover:not(:disabled){ filter:brightness(1.05); }

  .home-header{ text-align:center; display:flex; flex-direction:column; gap:8px; padding-top:8px; }
  .home-header h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:clamp(30px,5vw,44px); margin:0;
    background:linear-gradient(120deg, var(--coral), var(--purple) 55%, var(--sky));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .home-header p{ margin:0; color:var(--ink-soft); font-size:15.5px; font-weight:600; }
  .home-header p .en{ font-style:italic; color:#8B8496; font-weight:500; }

  .level-select{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .level-select span.lbl{ font-size:13.5px; font-weight:700; color:var(--ink-soft); margin-right:4px; }
  .level-btn{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:14.5px; color:var(--ink);
    background:#fff; border:2.5px solid var(--line); border-radius:100px; padding:9px 22px; cursor:pointer;
    transition:all .18s ease;
  }
  .level-btn:hover{ border-color:var(--sky); transform:translateY(-1px); }
  .level-btn.active{ color:#fff; border-color:transparent; background:linear-gradient(135deg, var(--purple), var(--sky)); box-shadow:0 8px 16px -6px rgba(155,93,229,.5); }

  .shelf{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:20px; }
  .story-btn{
    position:relative; border:none; cursor:pointer; border-radius:22px; padding:0; overflow:hidden;
    background:var(--paper); box-shadow:0 14px 26px -14px rgba(38,35,42,.35); text-align:left;
    transition:transform .2s ease, box-shadow .2s ease; display:flex; flex-direction:column;
  }
  .story-btn:hover{ transform:translateY(-5px); box-shadow:0 20px 32px -14px rgba(38,35,42,.4); }
  .story-thumb{ aspect-ratio:4/3; width:100%; display:block; position:relative; }
  .story-thumb svg{ width:100%; height:100%; display:block; }
  .thumb-overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .2s ease; pointer-events:none; }
  .story-btn.completed .story-thumb{ filter:saturate(.25) brightness(1.35); }
  .story-btn.completed .thumb-overlay{ opacity:1; background:rgba(255,255,255,.35); }
  .completed-stamp{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:18px; color:#1FA985;
    background:#fff; border:3px solid #1FA985; padding:6px 18px; border-radius:100px;
    transform:rotate(-6deg); box-shadow:0 6px 14px -6px rgba(0,0,0,.3);
  }
  .story-info{ padding:14px 16px 18px; display:flex; flex-direction:column; gap:4px; }
  .story-badge{ align-self:flex-start; font-size:11px; font-weight:700; color:var(--coral-deep); background:#FFE3DE; padding:3px 10px; border-radius:100px; margin-bottom:4px; }
  .story-info h3{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin:0; color:var(--ink); }
  .story-info span{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .story-score{ font-size:13px; font-weight:800; color:#1FA985; }
  .more-soon{
    border:2.5px dashed var(--line); border-radius:22px; display:flex; align-items:center; justify-content:center;
    min-height:190px; color:#B9AF95; font-weight:700; font-size:14px; text-align:center; padding:20px;
  }
  .home-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:4px; }

  /* ---- flashcards page ---- */
  .flash-stage{ display:flex; justify-content:center; padding:14px 0 6px; perspective:1600px; }
  .flashcard{
    width:min(300px,80vw); height:380px; position:relative; cursor:pointer;
    transform-style:preserve-3d; transition:transform .55s cubic-bezier(.4,.15,.2,1);
  }
  .flash-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:26px;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:36px;
    box-shadow:0 24px 46px -18px rgba(38,35,42,.45);
  }
  .flash-front{ background:linear-gradient(135deg, var(--coral), var(--pink)); }
  .flash-front span{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,6vw,34px); color:#fff; line-height:1.3; }
  .flash-back{ background:linear-gradient(135deg, var(--sky), var(--mint)); transform:rotateY(180deg); }
  .flash-back span{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(20px,5vw,26px); color:#fff; line-height:1.4; }
  .flash-controls{ display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; }
  .flash-progress{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink-soft); }
  .flash-empty{ text-align:center; color:var(--ink-soft); font-weight:600; font-size:14.5px; padding:30px 14px; line-height:1.6; max-width:440px; margin:0 auto; }

  /* ---- vocabulary page ---- */
  .vocab-card{ background:var(--paper); border-radius:22px; padding:8px 22px 12px; box-shadow:0 14px 26px -16px rgba(38,35,42,.35); }
  .vocab-head{ display:grid; grid-template-columns:1fr 1fr 26px; gap:10px; padding:14px 6px 10px; font-size:12px; font-weight:800; color:var(--ink-soft); border-bottom:2px solid var(--line); }
  .vocab-row{ display:grid; grid-template-columns:1fr 1fr 26px; grid-template-areas:"pl en del" "ctx ctx ctx"; align-items:center; gap:6px 10px; padding:12px 6px; border-bottom:1px solid var(--line); }
  .vocab-row:last-child{ border-bottom:none; }
  .vocab-pl{ grid-area:pl; font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; color:var(--ink); }
  .vocab-en{ grid-area:en; font-family:'Baloo 2',sans-serif; font-weight:600; font-size:14.5px; color:var(--ink-soft); }
  .vocab-del{ grid-area:del; border:none; background:none; color:#C9BFA8; font-size:15px; cursor:pointer; padding:4px; }
  .vocab-del:hover{ color:var(--coral-deep); }
  .vocab-ctx{ grid-area:ctx; font-size:11.5px; color:#B9AF95; font-weight:600; }
  .vocab-empty{ text-align:center; color:var(--ink-soft); font-weight:600; font-size:14.5px; padding:30px 14px; line-height:1.6; }
  @media (max-width:560px){ .vocab-head{ display:none; } }

  /* ---- add word to vocabulary control ---- */
  .page-left-footer{ margin-top:auto; padding-top:14px; display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .page-left-footer .page-num{ margin-top:0; padding-top:0; }
  .add-word-wrap{ position:relative; }
  .add-word-btn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:12.5px; color:var(--purple);
    background:#F1E9FE; border:1.5px solid #DCC9FA; border-radius:100px; padding:7px 14px; cursor:pointer;
  }
  .add-word-btn:hover{ background:#E6D8FC; }
  .add-word-form{
    display:none; position:absolute; bottom:calc(100% + 8px); right:0; background:#fff; border:1.5px solid var(--line);
    border-radius:14px; padding:8px; box-shadow:0 10px 22px -10px rgba(38,35,42,.35); gap:6px; z-index:8; white-space:nowrap;
  }
  .add-word-form.open{ display:flex; }
  .add-word-form input{
    font-family:'Baloo 2',sans-serif; font-size:13.5px; border:1.5px solid var(--line); border-radius:8px; padding:7px 9px; width:130px;
  }
  .add-word-form input:focus{ outline:none; border-color:var(--sky); }
  .add-word-submit{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:#fff; background:var(--purple);
    border:none; border-radius:8px; padding:7px 12px; cursor:pointer;
  }
  .add-word-submit:hover{ filter:brightness(1.08); }

  .detail-card{ background:var(--paper); border-radius:28px; overflow:hidden; box-shadow:0 20px 40px -20px rgba(38,35,42,.4); display:grid; grid-template-columns:1fr 1fr; }
  .detail-art{ display:flex; } .detail-art svg{ width:100%; height:100%; display:block; }
  .detail-body{ padding:34px 34px 30px; display:flex; flex-direction:column; gap:16px; }
  .detail-badge{ align-self:flex-start; font-size:12px; font-weight:700; color:#fff; background:linear-gradient(135deg, var(--purple), var(--pink)); padding:5px 14px; border-radius:100px; }
  .detail-body h2{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,4vw,32px); margin:0; color:var(--ink); }
  .desc-block{ display:flex; flex-direction:column; gap:4px; }
  .desc-tag{ font-size:11.5px; font-weight:700; color:var(--mint); letter-spacing:.02em; }
  .desc-block.en .desc-tag{ color:var(--sky); }
  .desc-block p{ margin:0; font-family:'Fraunces',serif; font-size:15.5px; line-height:1.6; color:var(--ink); }
  .desc-block.en p{ color:var(--ink-soft); font-style:italic; }
  .progress-note{ font-size:13.5px; font-weight:700; color:#8B6E1F; background:#FFF3D2; border:1.5px solid #F3DE9A; padding:9px 14px; border-radius:12px; }
  .detail-actions{ display:flex; flex-wrap:wrap; gap:12px; margin-top:6px; }
  @media (max-width:680px){ .detail-card{ grid-template-columns:1fr; } .detail-art{ aspect-ratio:16/10; } }

  .reader-topbar{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .reader-title{ font-family:'Fraunces',serif; font-weight:600; font-style:italic; font-size:15px; color:var(--ink-soft); }

  .book{ position:relative; border-radius:26px; box-shadow:0 24px 46px -18px rgba(38,35,42,.45); background:linear-gradient(135deg, var(--purple), var(--sky)); padding:10px; }
  .spread{ position:relative; display:grid; grid-template-columns:1fr 1fr; min-height:500px; border-radius:18px; overflow:hidden; background:var(--paper); }
  .page{ position:relative; padding:30px 28px 24px; display:flex; flex-direction:column; }
  .page-left{ background:linear-gradient(90deg, var(--paper-2) 0%, var(--paper) 16%); border-right:1px solid var(--line); }
  .page-right{ background:linear-gradient(270deg, var(--paper-2) 0%, var(--paper) 16%); }
  .spine-shadow{ position:absolute; top:0; bottom:0; left:50%; width:56px; transform:translateX(-50%); background:linear-gradient(90deg, rgba(0,0,0,.10), transparent 30%, transparent 70%, rgba(0,0,0,.10)); pointer-events:none; z-index:5; }
  .ribbon{ position:absolute; top:0; right:24px; width:24px; height:56px; background:linear-gradient(180deg, var(--coral), var(--pink)); border-radius:0 0 6px 6px; box-shadow:0 4px 8px rgba(0,0,0,.18); transition:height .3s ease; z-index:6; }
  .ribbon::after{ content:""; position:absolute; left:0; right:0; bottom:-12px; width:0; height:0; margin:0 auto; border-left:12px solid transparent; border-right:12px solid transparent; border-top:12px solid var(--pink); }
  .ribbon.hidden{ display:none; }

  .page-kicker{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:12px; letter-spacing:.02em; color:var(--purple); margin:0 0 12px; }
  .page-text{ font-family:'Fraunces',serif; font-size:19px; line-height:1.6; color:var(--ink); margin:0; }
  .translate-btn{
    margin-top:14px; align-self:flex-start; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13.5px; color:var(--sky);
    background:#EAF7FE; border:1.5px solid #BEE7F8; border-radius:100px; padding:8px 16px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition:background .2s ease;
  }
  .translate-btn:hover{ background:#D9F0FB; }
  .page-translation{
    margin:12px 0 0; padding:12px 14px; background:#F5F1FF; border-left:3px solid var(--purple); border-radius:8px;
    font-family:'Fraunces',serif; font-style:italic; font-size:15px; line-height:1.55; color:var(--ink-soft);
  }
  .page-num{ font-family:'Baloo 2',sans-serif; font-weight:600; font-size:12.5px; color:var(--ink-soft); margin-top:auto; padding-top:14px; }

  .scene-holder{ flex:1; display:flex; align-items:center; justify-content:center; }
  .scene-holder svg{ width:100%; height:auto; max-height:300px; border-radius:16px; }
  .scene-caption{ text-align:center; font-weight:700; font-size:12.5px; color:var(--ink-soft); margin-top:10px; }

  .fade-enter{ animation:pageIn .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes pageIn{ from{opacity:0; transform:translateX(8px);} to{opacity:1; transform:translateX(0);} }

  .reader-controls{ display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }
  .track-wrap{ display:flex; align-items:center; gap:10px; max-width:460px; margin:0 auto; width:100%; }
  .track{ position:relative; flex:1; height:6px; background:#EFE6CE; border-radius:10px; }
  .track-fill{ position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, var(--coral), var(--sun)); border-radius:10px; transition:width .3s ease; }
  .track-marker{ position:absolute; top:50%; width:13px; height:13px; background:#fff; border:3px solid var(--coral); border-radius:50%; transform:translate(-50%,-50%); transition:left .3s ease; }
  .track-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); white-space:nowrap; min-width:96px; text-align:right; }

  .exercise-label{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:12.5px; color:var(--purple); background:#F1E9FE; align-self:flex-start; padding:5px 13px; border-radius:100px; margin-bottom:14px; }
  .exercise-q{ font-family:'Fraunces',serif; font-size:20px; line-height:1.5; color:var(--ink); margin:0 0 20px; }
  .exercise-q .blank{ display:inline-block; min-width:70px; border-bottom:3px solid var(--coral); }
  .tf-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .opt-btn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15.5px; text-align:left;
    background:#fff; border:2.5px solid var(--line); border-radius:14px; padding:13px 18px;
    cursor:pointer; transition:border-color .2s ease, background .2s ease, transform .15s ease; width:100%;
  }
  .tf-row .opt-btn{ width:auto; flex:1; text-align:center; }
  .opt-btn:hover:not(:disabled){ border-color:var(--sky); transform:translateY(-1px); }
  .opt-btn:disabled{ cursor:default; }
  .mc-list{ display:flex; flex-direction:column; gap:10px; }
  .opt-btn.chosen.right{ border-color:#1FA985; background:#E9FBF3; }
  .opt-btn.chosen.wrong{ border-color:var(--coral-deep); background:#FFEDEA; }
  .opt-btn.reveal-right{ border-color:#1FA985; background:#E9FBF3; }

  .feedback-card{
    width:100%; max-width:280px; aspect-ratio:4/3; border-radius:18px; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(135deg, #FFF3D2, #FFE3D0);
  }
  .feedback-card.correct{ background:linear-gradient(135deg, #D9F5EA, #CDEFFF); }
  .feedback-card.wrong{ background:linear-gradient(135deg, #FFE3DE, #FFD7E4); }
  .feedback-neutral{ font-size:56px; }
  .feedback-word{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:26px; z-index:2; position:relative; }
  .feedback-word.correct{ color:#1FA985; animation:popIn .45s cubic-bezier(.3,1.6,.4,1); }
  .feedback-word.wrong{ color:var(--coral-deep); animation:shake .5s ease; }
  @keyframes popIn{ 0%{transform:scale(.3); opacity:0;} 60%{transform:scale(1.15); opacity:1;} 100%{transform:scale(1);} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }
  .particle{ position:absolute; top:50%; left:50%; width:7px; height:7px; margin:-3.5px; border-radius:50%; animation:burst .9s ease-out forwards; z-index:1; }
  @keyframes burst{ 0%{transform:translate(0,0) scale(1); opacity:1;} 100%{transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0;} }

  .score-num{ font-family:'Fraunces',serif; font-weight:600; font-size:52px; margin:6px 0 2px; color:var(--ink); }
  .score-msg{ font-family:'Fraunces',serif; font-size:16.5px; color:var(--ink-soft); margin:0 0 22px; }

  @media (max-width:680px){
    .spread{ grid-template-columns:1fr; }
    .page-left{ border-right:none; border-bottom:1px solid var(--line); }
    .spine-shadow{ display:none; }
    .page{ padding:24px 20px 18px; }
    .page-text{ font-size:17.5px; }
    .exercise-q{ font-size:18px; }
    .scene-holder svg{ max-height:220px; }
  }
  :focus-visible{ outline:3px solid var(--sky); outline-offset:2px; }

  /* ---- language switcher ---- */
  .flag-pl{ background:linear-gradient(to bottom, #ffffff 50%, #DC143C 50%); }
  .flag-fr{ background:linear-gradient(to right, #0055A4 33.33%, #ffffff 33.33% 66.66%, #EF4135 66.66%); }

  .lang-toggle{
    position:fixed; top:16px; right:16px; z-index:70;
    width:44px; height:44px; border-radius:50%; padding:0; overflow:hidden;
    border:3px solid #fff; cursor:pointer;
    box-shadow:0 10px 22px -8px rgba(38,35,42,.45);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .lang-toggle:hover{ transform:scale(1.06); box-shadow:0 14px 26px -8px rgba(38,35,42,.5); }
  .lang-toggle .flag-circle{ display:block; width:100%; height:100%; }

  .lang-overlay{
    position:fixed; inset:0; z-index:200;
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    display:none; align-items:center; justify-content:center;
    padding:24px;
  }
  .lang-overlay.open{ display:flex; }
  .lang-picker{ display:flex; gap:44px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
  .lang-option{
    background:none; border:none; cursor:pointer; padding:6px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .flag-circle-lg{
    width:96px; height:96px; border-radius:50%; overflow:hidden;
    border:4px solid #fff; box-shadow:0 16px 32px -12px rgba(38,35,42,.4);
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .lang-option:hover .flag-circle-lg{ transform:translateY(-3px) scale(1.04); }
  .lang-option.active .flag-circle-lg{ border-color:var(--purple); box-shadow:0 0 0 5px rgba(155,93,229,.28), 0 16px 32px -12px rgba(38,35,42,.4); }
  .lang-name{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:16.5px; color:var(--ink); }

  @media (max-width:480px){
    .flag-circle-lg{ width:78px; height:78px; }
    .lang-picker{ gap:30px; }
  }
</style>
</head>
<body>

<button class="lang-toggle" id="langToggleBtn" aria-label="Zmień język / Changer de langue" title="Zmień język / Changer de langue">
  <span class="flag-circle flag-pl" id="langToggleFlag"></span>
</button>

<div class="lang-overlay" id="langOverlay">
  <div class="lang-picker">
    <button class="lang-option" data-lang="pl">
      <span class="flag-circle-lg flag-pl"></span>

<script>
(function(){

  /* ================= ILLUSTRATION HELPERS ================= */
  function grad(id, c1, c2, angle){

  }
  function frame(gradId, c1, c2, inner, decor){
    decor = decor || '';
    return `<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
      <defs>${grad(gradId, c1, c2)}</defs>
      <rect x="0" y="0" width="320" height="240" rx="18" fill="url(#${gradId})"/>

  }
  function confetti(c1,c2,c3){
    return `<circle cx="26" cy="30" r="5" fill="${c1}" opacity=".85"/>
      <circle cx="290" cy="40" r="4" fill="${c2}" opacity=".85"/>

  /* ================= STORAGE HELPERS ================= */
  async function loadProgress(storyId, level, lang){
    try{
      const r = await window.storage.get('progress:'+storyId+':'+level+':'+lang, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  async function saveProgress(storyId, level, lang, data){
    try{ await window.storage.set('progress:'+storyId+':'+level+':'+lang, JSON.stringify(data), false); }catch(e){}
  }

  async function loadVocabulary(lang){
    try{
      const r = await window.storage.get('vocabulary:'+lang, false);
      return r ? JSON.parse(r.value) : [];
    }catch(e){ return []; }
  }
  async function saveVocabularyList(list, lang){
    try{ await window.storage.set('vocabulary:'+lang, JSON.stringify(list), false); }catch(e){}
  }
  async function translateWord(word, lang){
    const dict = lang === 'fr' ? FR_DICTIONARY : DICTIONARY;
    const local = dict[word.toLowerCase()];
    if(local) return local;
    try{
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=${lang}|en`);
      const data = await res.json();
      const translated = data && data.responseData && data.responseData.translatedText;
      if(translated && !/^\s*$/.test(translated)) return translated;
    }catch(e){ /* offline or blocked — leave blank, editable later */ }
    return '';
  }
  async function addWordToVocabulary(word, ctx, lang){
    const list = await loadVocabulary(lang);
    const exists = list.some(w => w.pl.toLowerCase() === word.toLowerCase());
    if(exists) return;
    const en = await translateWord(word, lang);
    list.push({ pl:word, en, ctx });
    await saveVocabularyList(list, lang);
  }

  /* ================= LANGUAGE SWITCHER ================= */
  async function loadLang(){
    try{ const r = await window.storage.get('ui-language', false); return r ? JSON.parse(r.value) : null; }catch(e){ return null; }
  }
  async function saveLang(lang){
    try{ await window.storage.set('ui-language', JSON.stringify(lang), false); }catch(e){}
  }

  const langToggleBtn = document.getElementById('langToggleBtn');

  function openLangPicker(){
    document.querySelectorAll('.lang-option').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
    langOverlay.classList.add('open');
  }
  function closeLangPicker(){ langOverlay.classList.remove('open'); }

  langToggleBtn.addEventListener('click', openLangPicker);
  langOverlay.addEventListener('click', (e) => { if(e.target === langOverlay) closeLangPicker(); });
  document.querySelectorAll('.lang-option').forEach(btn => {

      const lang = btn.dataset.lang;
      if(lang !== currentLang){
        currentLang = lang;
        await saveLang(currentLang);
        langToggleFlag.className = 'flag-circle flag-' + currentLang;
        buildShelf();
        closeLangPicker();
        showView('home');

        closeLangPicker();

  });

  const shelf = document.getElementById('shelf');
  function buildShelf(){
    updateLevelButtons();
    document.getElementById('homeTitle').textContent = t('homeTitle');
    document.getElementById('homeSubtitlePL').textContent = t('homeSubtitlePL');
    document.getElementById('homeSubtitleEN').textContent = t('homeSubtitleEN');

    document.getElementById('flashBtnLabel').textContent = t('flashBtn');

    stories.forEach(story => {
      const data = storyData(story);
      const content = data.levels[currentLevel];
      const btn = document.createElement('button');
      btn.className = 'story-btn';
      btn.innerHTML = `
        <span class="story-thumb">

  function renderVocabList(list){
    vocabList.innerHTML = '';
    vocabEmpty.style.display = list.length ? 'none' : 'block';
    list.slice().sort((a,b) => a.pl.localeCompare(b.pl, currentLang)).forEach(entry => {
      const row = document.createElement('div');
      row.className = 'vocab-row';
      row.innerHTML = `
        <span class="vocab-pl">${entry.pl}</span>
        <span class="vocab-en">${entry.en || '…'}</span>
        <button class="vocab-del" title="✕">✕</button>
        <span class="vocab-ctx">${entry.ctx || ''}</span>`;
      row.querySelector('.vocab-del').addEventListener('click', async () => {
        const fresh = await loadVocabulary(currentLang);
        const idx = fresh.findIndex(w => w.pl === entry.pl);
        if(idx > -1){ fresh.splice(idx,1); await saveVocabularyList(fresh, currentLang); renderVocabList(fresh); }
      });
      vocabList.appendChild(row);
    });
  }

  const flashEmpty = document.getElementById('flashEmpty');
  const flashcardEl = document.getElementById('flashcard');
  const flashFront = document.getElementById('flashFront');
  const flashBack = document.getElementById('flashBack');
  const flashProgress = document.getElementById('flashProgress');

  let flashVocab = [];
  let flashOrder = [];
  let flashIndex = 0;
  let flashFlipped = false;
  let flashDeg = 0;

  async function loadFlashState(){
    try{ const r = await window.storage.get('flashcards:'+currentLang, false); return r ? JSON.parse(r.value) : null; }catch(e){ return null; }
  }
  async function saveFlashState(){
    try{ await window.storage.set('flashcards:'+currentLang, JSON.stringify({ order:flashOrder, index:flashIndex }), false); }catch(e){}
  }
  function shuffleArr(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function currentFlashWord(){
    const pl = flashOrder[flashIndex];
    return flashVocab.find(w => w.pl === pl) || { pl, en:'' };
  }
  function paintFlashCard(){
    const w = currentFlashWord();
    flashFront.innerHTML = `<span>${w.pl}</span>`;
    flashBack.innerHTML = `<span>${w.en || '…'}</span>`;
    flashProgress.textContent = t('flashWordProgress')(flashIndex+1, flashOrder.length);
  }
  function resetCardOrientation(){
    flashDeg = 0; flashFlipped = false;
    flashcardEl.style.transition = 'none';
    flashcardEl.style.transform = 'rotateY(0deg)';
    void flashcardEl.offsetWidth;
    flashcardEl.style.transition = '';
  }

  flashBtn.addEventListener('click', openFlashcards);
  flashHomeBtn.addEventListener('click', () => { buildShelf(); showView('home'); });
  flashRestartBtn.addEventListener('click', async () => {
    flashOrder = shuffleArr(flashVocab.map(w => w.pl));
    flashIndex = 0;
    await saveFlashState();
    paintFlashCard();
    resetCardOrientation();
  });
  flashcardEl.addEventListener('click', async () => {
    if(!flashOrder.length) return;
    if(!flashFlipped){
      flashDeg += 180;
      flashcardEl.style.transform = `rotateY(${flashDeg}deg)`;
      flashFlipped = true;
    } else {
      flashIndex += 1;
      if(flashIndex >= flashOrder.length){
        flashOrder = shuffleArr(flashVocab.map(w => w.pl));
        flashIndex = 0;
      }
      await saveFlashState();
      paintFlashCard();
      flashDeg += 180;
      flashcardEl.style.transform = `rotateY(${flashDeg}deg)`;
      flashFlipped = false;
    }
  });

  async function openFlashcards(){
    document.getElementById('flashHomeBtnLabel').textContent = t('homeBtn');
    document.getElementById('flashPageTitle').textContent = t('flashPageTitle');
    flashRestartBtn.textContent = t('flashRestart');
    flashEmpty.textContent = t('flashEmpty');
    showView('flashcards');
    const vocab = await loadVocabulary(currentLang);
    flashVocab = vocab;

    if(!vocab.length){
      flashEmpty.style.display = 'block';
      flashStage.style.display = 'none';
      flashControls.style.display = 'none';
      return;
    }
    flashEmpty.style.display = 'none';
    flashStage.style.display = 'flex';
    flashControls.style.display = 'flex';

    const saved = await loadFlashState();
    const plSet = new Set(vocab.map(w => w.pl));
    let order = (saved && Array.isArray(saved.order)) ? saved.order.filter(pl => plSet.has(pl)) : [];
    const already = new Set(order);
    const missing = shuffleArr(vocab.map(w => w.pl).filter(pl => !already.has(pl)));
    order = order.concat(missing);
    let index = (saved && typeof saved.index === 'number') ? saved.index : 0;
    if(order.length === 0){ order = shuffleArr(vocab.map(w => w.pl)); index = 0; }
    if(index >= order.length || index < 0) index = 0;

    flashOrder = order;
    flashIndex = index;
    await saveFlashState();
    paintFlashCard();
    resetCardOrientation();
  }

  /* ================= DETAIL ================= */
  const detailArt = document.getElementById('detailArt');
  const detailLevel = document.getElementById('detailLevel');
  const detailTitle = document.getElementById('detailTitle');
  const detailDescPL = document.getElementById('detailDescPL');
  const detailDescEN = document.getElementById('detailDescEN');
  const progressNote = document.getElementById('progressNote');
  const detailActions = document.getElementById('detailActions');
  const readerTitle = document.getElementById('readerTitle');

  function openDetail(story, level){
    const data = storyData(story);
    const content = data.levels[level];
    detailArt.innerHTML = scenes[story.cover]();
    document.getElementById('descTagNative').textContent = (currentLang === 'fr') ? 'EN FRANÇAIS' : 'PO POLSKU';
    document.getElementById('descTagEN').textContent = 'IN ENGLISH';
    detailLevel.textContent = content.label;
    detailTitle.textContent = data.title;
    detailDescPL.textContent = content.descNative;
    detailDescEN.textContent = content.descEN;
    progressNote.style.display = 'none';
    detailActions.innerHTML = '';
    showView('detail');

    loadProgress(story.id, level, currentLang).then(p => {
      detailActions.innerHTML = '';
      const total = combinedExercises(content).length;
      if(p && p.completed){
        progressNote.style.display = 'block';
        progressNote.textContent = t('completedNote')(p.finalScore, p.total);
        detailActions.appendChild(makeBtn('btn-primary', playIconSvg(), t('rereadBtn'), () => beginFresh(story, level, { completed:true, finalScore:p.finalScore, total:p.total })));
      } else if(p && (p.phase === 'story' || p.phase === 'exercise')){
        progressNote.style.display = 'block';
        progressNote.textContent = p.phase === 'story'
          ? t('stoppedPage')(p.pageIndex+1, content.pages.length)
          : t('stoppedExercise')(p.exerciseIndex+1, total);
        detailActions.appendChild(makeBtn('btn-primary', playIconSvg(), t('continueBtn'), () => resumeFrom(story, level, p)));
        detailActions.appendChild(makeBtn('btn-ghost', '', t('restartBtn'), () => beginFresh(story, level)));
      } else {
        detailActions.appendChild(makeBtn('btn-primary', playIconSvg(), t('startBtn'), () => beginFresh(story, level)));
      }
      detailActions.appendChild(makeBtn('btn-home', homeIconSvg(), t('homeBtn') + ' · Home', () => { buildShelf(); showView('home'); }));
    });
  }

  function playIconSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 5l12 7-12 7V5z" stroke-linejoin="round"/></svg>'; }
  function homeIconSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 11.5L12 4l8 7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function makeBtn(cls, iconHtml, label, onClick){
    const b = document.createElement('button');
    b.className = 'btn ' + cls;
    b.innerHTML = (iconHtml||'') + '<span>' + label + '</span>';
    b.addEventListener('click', onClick);
    return b;
  }

  function setActive(story, level, keepPersisted){
    activeStory = story;
    activeLevel = level;
    activeLang = currentLang;
    activeContent = story.langs[activeLang].levels[level];
    persisted = keepPersisted || { completed:false, finalScore:null, total:combinedExercises(activeContent).length };
    readerTitle.textContent = `${story.langs[activeLang].title} · ${activeContent.label}`;
  }

  function beginFresh(story, level, keepPersisted){
    setActive(story, level, keepPersisted);
    runningScore = 0;
    enterStory(0);
    showView('reader');
  }
  function resumeFrom(story, level, p){
    setActive(story, level, { completed:p.completed, finalScore:p.finalScore, total:p.total });
    runningScore = p.score || 0;
    persisted.total = p.total || combinedExercises(activeContent).length;
    if(p.phase === 'exercise'){ enterExercise(p.exerciseIndex||0); }
    else { enterStory(p.pageIndex||0); }
    showView('reader');
  }

  /* ================= READER ================= */
  const pageLeft = document.getElementById('pageLeft');
  const pageRight = document.getElementById('pageRight');
  const ribbon = document.getElementById('ribbon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const nextBtnLabel = document.getElementById('nextBtnLabel');
  const readerControls = document.getElementById('readerControls');
  const trackWrap = document.getElementById('trackWrap');
  const trackFill = document.getElementById('trackFill');
  const trackMarker = document.getElementById('trackMarker');
  const trackLabel = document.getElementById('trackLabel');
  const readerHomeBtn = document.getElementById('readerHomeBtn');

  function enterStory(i){
    phase = 'story'; pageIndex = i;
    readerControls.style.display = 'flex';
    trackWrap.style.display = 'flex';
    ribbon.classList.remove('hidden');
    document.getElementById('readerHomeBtnLabel').textContent = t('homeBtn');
    renderStoryPage(i);
    persistNow();
  }
  function enterExercise(i){
    phase = 'exercise'; exerciseIndex = i; answered = false;
    readerControls.style.display = 'none';
    trackWrap.style.display = 'none';
    ribbon.classList.add('hidden');
    document.getElementById('readerHomeBtnLabel').textContent = t('homeBtn');
    renderExercise(i);
    persistNow();
  }
  function enterScore(){
    phase = 'score';
    readerControls.style.display = 'none';
    trackWrap.style.display = 'none';
    ribbon.classList.add('hidden');
    const total = combinedExercises(activeContent).length;
    persisted = { completed:true, finalScore:runningScore, total:total };
    renderScore();
    persistNow();
    buildShelf();
  }

  function renderStoryPage(i){
    const pages = activeContent.pages;
    const p = pages[i];
    pageLeft.innerHTML = `
      <p class="page-kicker">${activeStory.langs[activeLang].title} · ${activeContent.label}</p>
      <p class="page-text fade-enter">${p.text}</p>
      <button class="translate-btn" id="translateBtn">${t('showTranslation')}</button>
      <p class="page-translation" id="pageTranslation" style="display:none;">${p.textEN}</p>
      <div class="page-left-footer">
        <p class="page-num">${t('pageWord')} ${i+1} ${t('ofWord')} ${pages.length}</p>
        <div class="add-word-wrap">
          <button class="add-word-btn" id="addWordBtn" title="${t('addWordTitle')}">${t('addWordBtn')}</button>
          <div class="add-word-form" id="addWordForm">
            <input type="text" id="addWordInput" placeholder="${t('addWordPlaceholder')}" autocomplete="off">
            <button class="add-word-submit" id="addWordSubmit">${t('addWordSubmit')}</button>
          </div>
        </div>
      </div>`;
    pageRight.innerHTML = `<div class="scene-holder">${scenes[p.scene]()}</div><p class="scene-caption">${p.caption}</p>`;

    const tBtn = document.getElementById('translateBtn');
    const tText = document.getElementById('pageTranslation');
    tBtn.addEventListener('click', () => {
      const showing = tText.style.display !== 'none';
      tText.style.display = showing ? 'none' : 'block';
      tBtn.textContent = showing ? t('showTranslation') : t('hideTranslation');
    });

    const addBtn = document.getElementById('addWordBtn');
    const addForm = document.getElementById('addWordForm');
    const addInput = document.getElementById('addWordInput');
    const addSubmit = document.getElementById('addWordSubmit');
    addBtn.addEventListener('click', () => {
      const open = addForm.classList.toggle('open');
      if(open) addInput.focus();
    });
    async function submitWord(){
      const word = addInput.value.trim();
      if(!word) return;
      addSubmit.disabled = true;
      addSubmit.textContent = t('addWordTranslating');
      const ctx = `${activeStory.langs[activeLang].title} · ${activeContent.label} · ${t('pageWord')} ${i+1}`;
      await addWordToVocabulary(word, ctx, activeLang);
      addInput.value = '';
      addSubmit.textContent = t('addWordAdded');
      setTimeout(() => { addSubmit.textContent = t('addWordSubmit'); addSubmit.disabled = false; }, 900);
      addInput.focus();
    }
    addSubmit.addEventListener('click', submitWord);
    addInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); submitWord(); } });

    ribbon.style.height = (48 + (i/(pages.length-1))*36) + 'px';
    const pct = (i/(pages.length-1))*100;
    trackFill.style.width = pct + '%';
    trackMarker.style.left = pct + '%';
    trackLabel.textContent = `${t('pageWord')} ${i+1} ${t('ofWord')} ${pages.length}`;

    prevBtn.disabled = (i===0);
    document.getElementById('prevBtnLabel').textContent = t('backBtn');
    nextBtnLabel.textContent = (i === pages.length-1) ? t('exercisesBtn') : t('nextBtn');
  }

  prevBtn.addEventListener('click', () => { if(pageIndex>0) enterStory(pageIndex-1); });
  nextBtn.addEventListener('click', () => {
    const pages = activeContent.pages;
    if(pageIndex < pages.length-1) enterStory(pageIndex+1);
    else enterExercise(0);
  });
  readerHomeBtn.addEventListener('click', () => { buildShelf(); showView('home'); });

  document.addEventListener('keydown', (e) => {
    if(!views.reader.classList.contains('active') || phase !== 'story') return;
    if(e.key === 'ArrowRight') nextBtn.click();
    if(e.key === 'ArrowLeft') prevBtn.click();
  });

  function renderExercise(i){
    const list = combinedExercises(activeContent);
    const ex = list[i];
    let questionHtml = '';
    if(ex.type === 'tf'){
      questionHtml = `<p class="exercise-q">${ex.statement}</p>
        <div class="tf-row">
          <button class="opt-btn" data-val="true">${t('trueLabel')}</button>
          <button class="opt-btn" data-val="false">${t('falseLabel')}</button>
        </div>`;
    } else {
      const withBlank = ex.sentence.replace('___', '<span class="blank">&nbsp;</span>');
      questionHtml = `<p class="exercise-q">${withBlank}</p>
        <div class="mc-list">
          ${ex.options.map((o,idx)=>`<button class="opt-btn" data-idx="${idx}">${o}</button>`).join('')}
        </div>`;
    }
    pageLeft.innerHTML = `<p class="exercise-label">${t('exerciseWord')} ${i+1} ${t('ofWord')} ${list.length}</p>${questionHtml}`;
    pageRight.innerHTML = `<div class="feedback-card" id="feedbackCard"><span class="feedback-neutral">❓</span></div>`;

    pageLeft.querySelectorAll('.opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if(answered) return;
        answered = true;
        let isCorrect;
        if(ex.type === 'tf'){ isCorrect = (btn.dataset.val === String(ex.correct)); }
        else { isCorrect = (parseInt(btn.dataset.idx,10) === ex.correct); }
        pageLeft.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
        btn.classList.add('chosen', isCorrect ? 'right' : 'wrong');
        if(!isCorrect){
          if(ex.type === 'tf'){ pageLeft.querySelector(`.opt-btn[data-val="${ex.correct}"]`).classList.add('reveal-right'); }
          else { pageLeft.querySelector(`.opt-btn[data-idx="${ex.correct}"]`).classList.add('reveal-right'); }
        } else { runningScore++; }
        showFeedback(isCorrect);
        setTimeout(() => { if(i < list.length-1) enterExercise(i+1); else enterScore(); }, 1900);
      });
    });
  }

  function showFeedback(isCorrect){
    const card = document.getElementById('feedbackCard');
    if(isCorrect){
      card.className = 'feedback-card correct';
      card.innerHTML = `<span class="feedback-word correct">${t('correctWord')}</span>`;
      const colors = ['#FF6B5B','#FFC93C','#39B7E8','#2FCB9E','#9B5DE5','#FF8FB1'];
      for(let k=0;k<16;k++){
        const p = document.createElement('span');
        p.className = 'particle';
        const angle = Math.random()*Math.PI*2;
        const dist = 60 + Math.random()*70;
        p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
        p.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
        p.style.background = colors[k % colors.length];
        p.style.animationDelay = (Math.random()*0.15) + 's';
        card.appendChild(p);
      }
    } else {
      card.className = 'feedback-card wrong';
      card.innerHTML = `<span class="feedback-word wrong">${t('incorrectWord')}</span>`;
    }
  }

  function renderScore(){
    const total = combinedExercises(activeContent).length;
    let msg;
    if(runningScore === total) msg = t('scorePerfect');
    else if(runningScore >= total*0.6) msg = t('scoreGood');
    else msg = t('scoreTryAgain');

    pageLeft.innerHTML = `
      <p class="exercise-label">${t('finalScoreLabel')}</p>
      <p class="score-num">${runningScore} / ${total}</p>
      <p class="score-msg">${msg}</p>
      <button class="btn btn-primary" id="scoreHomeBtn">${homeIconSvg()}<span>${t('homeBtn')}</span></button>`;
    pageRight.innerHTML = `<div class="scene-holder">${trophyArt()}</div><p class="scene-caption">${t('congrats')}</p>`;

    document.getElementById('scoreHomeBtn').addEventListener('click', () => { buildShelf(); showView('home'); });
  }

})();
</script>
</body>
</html>
